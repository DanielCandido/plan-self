services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-plan_self}
      POSTGRES_USER: ${POSTGRES_USER:-plan-self}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-plan-self}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-plan-self} -d ${POSTGRES_DB:-plan_self}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    image: plan-self-api:latest
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/docs').then(r => { if (!r.ok) process.exit(1) }).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  gateway:
    image: plan-self-gateway:latest
    env_file:
      - .env
    depends_on:
      api:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    image: plan-self-web:latest
    env_file:
      - .env
    depends_on:
      api:
        condition: service_healthy

  setup-wizard:
    image: plan-self-setup-wizard:latest
    env_file:
      - .env

  worker:
    image: plan-self-worker:latest
    env_file:
      - .env
    depends_on:
      redis:
        condition: service_healthy
      api:
        condition: service_healthy

  nginx:
    image: nginx:1.27-alpine
    depends_on:
      web:
        condition: service_started
      api:
        condition: service_healthy
      setup-wizard:
        condition: service_started
      gateway:
        condition: service_started
    volumes:
      - ./infrastructure/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./infrastructure/pki/server.crt:/etc/nginx/certs/server.crt:ro
      - ./infrastructure/pki/server.key:/etc/nginx/certs/server.key:ro
    ports:
      - "${PLAN_SELF_HTTP_PORT:-8080}:80"
      - "${PLAN_SELF_HTTPS_PORT:-8443}:443"

volumes:
  postgres_data:
