name: CI

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: true
  NEXT_TELEMETRY_DISABLED: 1
  TURBO_TELEMETRY_DISABLED: 1

jobs:
  quality:
    name: Quality gate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Generate and validate Prisma client
        run: |
          npm run db:generate
          ./node_modules/.bin/prisma validate --schema packages/database/prisma/schema.prisma
      - name: Lint and type-check
        run: npm run lint
      - name: Run tests
        run: npm test
      - name: Build all applications and packages
        run: npm run build

  infrastructure:
    name: Infrastructure gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Prepare non-secret validation environment
        run: cp .env.example .env
      - name: Validate development Compose
        run: docker compose -f docker-compose.yml config --quiet
      - name: Validate air-gapped Compose
        run: docker compose -f docker-compose.offline.yml config --quiet
      - name: Ensure only Nginx publishes host ports
        shell: bash
        run: |
          published_services="$(docker compose -f docker-compose.offline.yml config --format json | jq -r '.services | to_entries[] | select(.value.ports != null) | .key')"
          test "$published_services" = "nginx"
      - name: Ensure application images are explicitly local
        shell: bash
        run: |
          docker compose -f docker-compose.offline.yml config --format json \
            | jq -e '.services | [.api, .gateway, .web, ."setup-wizard", .worker] | all(.image | startswith("localhost/plan-self-"))'
