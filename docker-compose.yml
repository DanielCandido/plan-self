services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-plan_self}
      POSTGRES_USER: ${POSTGRES_USER:-plan-self}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-plan-self}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-plan-self} -d ${POSTGRES_DB:-plan_self}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: infrastructure/docker/api.Dockerfile
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "3001:3001"

  gateway:
    build:
      context: .
      dockerfile: infrastructure/docker/gateway.Dockerfile
    env_file:
      - .env
    depends_on:
      - api
      - redis
    ports:
      - "3010:3010"

  web:
    build:
      context: .
      dockerfile: infrastructure/docker/web.Dockerfile
    env_file:
      - .env
    depends_on:
      - api
    ports:
      - "3000:3000"

  setup-wizard:
    build:
      context: .
      dockerfile: infrastructure/docker/setup-wizard.Dockerfile
    env_file:
      - .env
    ports:
      - "3002:3002"

  worker:
    build:
      context: .
      dockerfile: infrastructure/docker/worker.Dockerfile
    env_file:
      - .env
    depends_on:
      - redis
      - api

  nginx:
    image: nginx:1.27-alpine
    depends_on:
      - web
      - api
      - setup-wizard
      - gateway
    volumes:
      - ./infrastructure/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./infrastructure/pki/server.crt:/etc/nginx/certs/server.crt:ro
      - ./infrastructure/pki/server.key:/etc/nginx/certs/server.key:ro
    ports:
      - "80:80"
      - "443:443"

volumes:
  postgres_data:
